version = 1
; Router mainline nas 2x MI50. Production values para o 35B; 27B/MinerU
; seguem the internal sizing notes. stop-timeout = 120 NAO e opcional nas MI50.
[*]
n-gpu-layers = 999
flash-attn = on
metrics = true
stop-timeout = 120
jinja = true

[mi50-35b]
model = /models/qwen3.6-35b-a3b-iq4xs/Qwen3.6-35B-A3B-IQ4_XS-4.19bpw.gguf
mmproj = /models/qwen3.6-35b-a3b-mmproj/mmproj-BF16.gguf
split-mode = layer
tensor-split = 0.518,0.482
ctx-size = 380000
parallel = 2
batch-size = 2048
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
spec-type = draft-mtp
cache-ram = 8192
slot-save-path = /kvslots/rt/mi50-35b

[mi50-27b]
model = /models/qwen3.8-27b-gsqrco-iq3xxs-mtp/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
mmproj = /models/qwen3.8-27b-gsqrco-iq3xxs-mtp/mmproj-BF16.gguf
split-mode = layer
tensor-split = 0.5,0.5
ctx-size = 262144
parallel = 2
batch-size = 2048
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q4_0
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-checkpoints = 8
checkpoint-min-step = 16384
cache-ram = 4096
slot-save-path = /kvslots/rt/mi50-27b

[mineru-a]
model = /models/mineru2.5-pro-q8/MinerU2.5-Pro-2605-1.2B-Q8_0.gguf
mmproj = /models/mineru2.5-pro-mmproj/mmproj-MinerU2.5-Pro-2605-Q8_0.gguf
device = ROCm0
split-mode = none
special = true
ctx-size = 65536
parallel = 8
image-min-tokens = 64
warmup = false
cache-ram = 0

[mineru-b]
model = /models/mineru2.5-pro-q8/MinerU2.5-Pro-2605-1.2B-Q8_0.gguf
mmproj = /models/mineru2.5-pro-mmproj/mmproj-MinerU2.5-Pro-2605-Q8_0.gguf
device = ROCm1
split-mode = none
special = true
ctx-size = 65536
parallel = 8
image-min-tokens = 64
warmup = false
cache-ram = 0

[mineru-2g]
model = /models/mineru2.5-pro-q8/MinerU2.5-Pro-2605-1.2B-Q8_0.gguf
mmproj = /models/mineru2.5-pro-mmproj/mmproj-MinerU2.5-Pro-2605-Q8_0.gguf
split-mode = layer
tensor-split = 0.5,0.5
special = true
ctx-size = 65536
parallel = 8
image-min-tokens = 64
warmup = false
cache-ram = 0
